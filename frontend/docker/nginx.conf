# Access logs omit query strings because the existing download links carry Sanctum tokens.
log_format erp '$remote_addr - $request_method $uri $server_protocol $status $body_bytes_sent $request_time';

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log /var/log/nginx/access.log erp;
    client_max_body_size 32m;

    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Resolve app again after container recreation. The Docker DNS server is internal.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ ^/api/?$ {
        default_type application/json;
        return 404 '{"message":"Ruta API no encontrada."}';
    }

    location ~ ^/(api/|up$) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param HTTP_PROXY "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 135s;
        set $php_fpm app:9000;
        fastcgi_pass $php_fpm;
    }

    # Contracts, receipt archives and legacy PDFs are available through Laravel only.
    location = /storage { return 404; }
    location ^~ /storage/ { return 404; }
    location ~ /\. { return 404; }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
